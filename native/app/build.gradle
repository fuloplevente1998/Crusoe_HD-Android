plugins { id 'com.android.application' }

// One public identity contract for local and GitHub builds. Never generate a new key.
def identity = new groovy.json.JsonSlurper().parse(rootProject.file('config/android-identity.json'))
def codeOverride = providers.gradleProperty('crusoeVersionCode').orElse(providers.environmentVariable('CRUSOE_VERSION_CODE'))
def epochSeconds = java.time.Instant.parse(identity.version_epoch_utc).epochSecond
def selectedCode = codeOverride.isPresent() ? codeOverride.get().toLong() : java.time.Instant.now().epochSecond - epochSeconds
if (selectedCode < identity.minimum_version_code || selectedCode > 2100000000L) {
    throw new GradleException('Invalid Crusoe versionCode: use a newer UTC build or an explicit compatible crusoeVersionCode.')
}
def signingPath = providers.environmentVariable('CRUSOE_SIGNING_STORE_FILE').getOrElse('private/signing/native-debug.keystore')
def stableKey = rootProject.file(signingPath)
def stableStorePassword = providers.environmentVariable('CRUSOE_SIGNING_STORE_PASSWORD').getOrElse('android')
def stableAlias = providers.environmentVariable('CRUSOE_SIGNING_KEY_ALIAS').getOrElse('androiddebugkey')
def stableKeyPassword = providers.environmentVariable('CRUSOE_SIGNING_KEY_PASSWORD').getOrElse('android')

def verifyStableIdentity = tasks.register('verifyUpdateSigningIdentity') {
    doLast {
        if (!stableKey.isFile()) {
            throw new GradleException('Existing Crusoe signing key missing. Set GitHub Actions secret CRUSOE_SIGNING_KEYSTORE_B64 or restore private/signing/native-debug.keystore. No replacement signing key will be generated.')
        }
        def store = java.security.KeyStore.getInstance(stableKey, stableStorePassword.toCharArray())
        def certificate = store.getCertificate(stableAlias)
        if (certificate == null) throw new GradleException('Crusoe signing alias does not exist.')
        def fingerprint = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
        if (!fingerprint.equalsIgnoreCase(identity.certificate_sha256)) {
            throw new GradleException('Signing certificate does not match the installed native Crusoe app. Refusing an incompatible APK.')
        }
        logger.lifecycle('Verified stable Crusoe signing identity; versionCode=' + selectedCode)
    }
}
tasks.configureEach {
    if (name == 'validateSigningDebug' || name == 'validateSigningRelease') dependsOn(verifyStableIdentity)
}
android {
    namespace 'hu.crusoe.standalone'
    compileSdk 36
    defaultConfig {
        applicationId identity.application_id
        minSdk 26
        targetSdk 35
        versionCode selectedCode.toInteger()
        versionName '0.6.2-native-alpha'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    signingConfigs { stable {
        storeFile stableKey
        storePassword stableStorePassword
        keyAlias stableAlias
        keyPassword stableKeyPassword
    } }
    buildTypes {
        debug { signingConfig signingConfigs.stable }
        release { signingConfig signingConfigs.stable }
    }
    testOptions { unitTests {
        includeAndroidResources = true
        all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'crusoe.artifacts', rootProject.file('artifacts').absolutePath
        }
    } }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
