plugins { id 'com.android.application' }
android {
    namespace 'hu.crusoe.standalone'
    compileSdk 36
    defaultConfig {
        applicationId 'hu.crusoe.standalone'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.5.0-native-alpha'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    signingConfigs { debug {
        def preservedKey = rootProject.file('private/signing/native-debug.keystore')
        if (preservedKey.exists()) {
            storeFile preservedKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    } }
    testOptions { unitTests {
        includeAndroidResources = true
        all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'crusoe.artifacts', rootProject.file('artifacts').absolutePath
        }
    } }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
