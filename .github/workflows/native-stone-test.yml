name: N12 stone-regrowth APK test

on:
  workflow_dispatch:
  push:
    branches:
      - fix/n12-stone-regrowth-softlock
    paths:
      - native/app/src/main/java/**
      - native/tests/**
      - native/scripts/**
      - .github/workflows/native-stone-test.yml

permissions:
  contents: read

jobs:
  native-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android build dependencies
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore public 0.6.0 world data for local CI compilation
        run: |
          curl -fLSs --retry 3 -o /tmp/native060.apk 'https://raw.githubusercontent.com/fuloplevente1998/Crusoe_HD-Android/apk-download-native-0.6.0/Crusoe-Native-0.6.0.apk'
          echo '25b85eeaacc43f0056ab6fb886798e2e778905308d3e8da8a2c9426fac2a4b8c  /tmp/native060.apk' | sha256sum -c -
          unzip -p /tmp/native060.apk assets/world.pack > native/app/src/main/assets/world.pack
          echo '324279ccfdb618d769572f1233d64c99a71725f5cf138acc84a7e1c0231bc6ce  native/app/src/main/assets/world.pack' | sha256sum -c -
      - name: Separate QA package, never overwrite existing game
        run: |
          sed -i "s/applicationId 'hu.crusoe.standalone'/applicationId 'hu.crusoe.standalone.n12test'/" native/app/build.gradle
          sed -i "s/versionCode 7/versionCode 8/" native/app/build.gradle
          sed -i "s/versionName '0.6.0-native-alpha'/versionName '0.6.1-n12-test'/" native/app/build.gradle
      - name: Run tests and build debug APK
        working-directory: native
        run: |
          chmod +x gradlew
          bash scripts/test_engine.sh
          ./gradlew --no-daemon --console=plain testDebugUnitTest assembleDebug
      - name: Verify QA APK exists
        run: test -s native/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: crusoe-n12-stone-test-apk
          path: native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
