name: Native Android update APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/native-engine-v01
      - fix/native-update-signing
      - develop
    paths:
      - native/**
      - .github/workflows/android-debug.yml
      - .github/workflows/native-update.yml

permissions:
  contents: read

jobs:
  update:
    uses: ./.github/workflows/native-update.yml
    secrets: inherit
