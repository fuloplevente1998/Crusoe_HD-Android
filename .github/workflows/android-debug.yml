name: Android debug baseline

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/android-debug.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crusoe-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout project configuration
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact upstream Android SDK / NDK
        run: |
          sdkmanager --install "platforms;android-37" "ndk;29.0.14206865"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Checkout pinned open-source J2ME Loader
        env:
          UPSTREAM_COMMIT: 13e29830632464719a643043e1113310fe6e64cc
        run: |
          git clone --filter=blob:none https://github.com/nikita36078/J2ME-Loader.git loader
          git -C loader checkout "$UPSTREAM_COMMIT"
          git -C loader submodule update --init --recursive
          echo "J2ME Loader commit: $(git -C loader rev-parse HEAD)"

      - name: Configure temporary CI signing credentials
        run: |
          keytool -genkeypair -noprompt -keystore loader/app/debug-ci.jks \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=Crusoe CI,O=Test Build,C=HU"
          cat > loader/keystore.properties <<'PROPS'
          storeFile=debug-ci.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          PROPS

      - name: Build clean J2ME Loader openDebug APK
        working-directory: loader
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleOpenDebug

      - name: Show generated APK
        run: |
          find loader/app/build/outputs/apk/open/debug -maxdepth 1 -name '*.apk' -ls
          test -n "$(find loader/app/build/outputs/apk/open/debug -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Upload unsigned-for-release debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crusoe-j2me-loader-debug-apk
          path: loader/app/build/outputs/apk/open/debug/*.apk
          if-no-files-found: error
          retention-days: 7
